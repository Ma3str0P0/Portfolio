<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style id="pf-style">
/* Layout: control-room spec sheet. A sticky identity rail on the left, the work log scrolling on the right. */
:root{
  --bg:#EDF1EF; --surface:#F7F9F8; --ink:#13201C; --muted:#56665F; --line:#C9D3CF;
  --accent:#0D6B5B; --signal:#B86A12; --signal-bg:#F6E7D3; --shade:rgba(10,20,17,.82);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#141D1A; --ink:#E2EAE7; --muted:#93A49E; --line:#25322E;
  --accent:#55BFA6; --signal:#EBA24F; --signal-bg:#2E2416; --shade:rgba(0,0,0,.86); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#141D1A; --ink:#E2EAE7; --muted:#93A49E; --line:#25322E;
  --accent:#55BFA6; --signal:#EBA24F; --signal-bg:#2E2416; --shade:rgba(0,0,0,.86); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,.shot:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.shell{max-width:1240px;margin:0 auto;padding-block:56px 72px;display:grid;grid-template-columns:minmax(250px,310px) minmax(0,1fr);gap:64px}

/* identity rail */
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 40px);align-self:start;display:flex;flex-direction:column;gap:22px}
.tagpath{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.tagpath b{color:var(--signal);font-weight:500}
.name{font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:2.35rem;line-height:1.02;letter-spacing:-.01em;margin:0;text-wrap:balance}
.role{font-family:var(--f-display);font-stretch:100%;font-weight:500;font-size:1.05rem;color:var(--accent);margin:-10px 0 0}
.summary{margin:0;color:var(--ink);font-size:15.5px}
.contact{display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.contact .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.contact .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:64px;flex:none}
.email{font-family:var(--f-mono);font-size:13.5px;user-select:all;word-break:break-all}
.copy{font:500 12px var(--f-mono);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;padding:2px 8px;cursor:pointer}
.copy:hover{border-color:var(--accent)}
.readout{border-top:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr);margin:0}
.readout dt,.readout dd{border-bottom:1px solid var(--line);padding:9px 0;margin:0}
.readout dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-right:14px;padding-top:12px}
.readout dd{font-size:14px}

/* work log */
.main{display:flex;flex-direction:column;gap:72px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin:0 0 8px}
.sec-h h2{font-family:var(--f-display);font-stretch:118%;font-weight:700;font-size:1rem;letter-spacing:.12em;text-transform:uppercase;margin:0}
.sec-h span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.projects{display:flex;flex-direction:column}
.proj{display:grid;grid-template-columns:150px minmax(0,1fr);gap:28px;padding-block:36px;border-bottom:1px solid var(--line)}
.proj:last-child{border-bottom:0}
.meta{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted)}
.meta .yr{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);font-size:13px}
.kind{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--signal);margin:0 0 6px}
.proj h3{font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:1.65rem;line-height:1.15;margin:0 0 12px;text-wrap:balance}
.proj .lede{margin:0 0 18px;max-width:68ch;font-size:16.5px}
.proj ul{margin:0 0 18px;padding-left:1.1em;max-width:68ch;display:flex;flex-direction:column;gap:6px;font-size:15px}
.proj li::marker{color:var(--signal)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.chips li{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:3px;padding:2px 8px;color:var(--ink);background:var(--surface)}
.links{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;font-size:14.5px}
.gallery{margin:0 0 22px;display:flex;flex-direction:column;gap:10px}
.shot{display:block;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#0b0f0e;cursor:zoom-in;width:100%}
.shot img{display:block;width:100%;height:auto}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs .shot{width:120px}
.gallery figcaption{font-size:13px;color:var(--muted)}

.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 40px;padding-top:18px}
.skills h4{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 6px}
.skills p{margin:0;font-size:15px}
.exp{margin:0;padding:0;list-style:none}
.exp li{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:20px;padding-block:14px;border-bottom:1px solid var(--line);align-items:baseline}
.exp .p{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.exp .o{font-weight:600}
.exp .r{display:block;font-weight:400;color:var(--muted);font-size:14.5px}
.exp .pl{font-size:13.5px;color:var(--muted);text-align:right}
.foot{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* lightbox */
.lb{position:fixed;inset:0;background:var(--shade);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 20px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lb img{max-width:100%;max-height:calc(100% - 48px);border-radius:4px}
.lb p{margin:0;color:#E2EAE7;font-size:14px;text-align:center}

/* editor (owner only) */
.ed-toggle{position:fixed;right:calc(env(safe-area-inset-right,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:40;
  font:600 14px var(--f-body);background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:10px 18px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.ed-bar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:2px solid var(--signal);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px));
  display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.ed-bar .msg{margin-right:auto;font-size:14px;color:var(--muted);min-width:0}
.ed-bar .msg.err{color:var(--signal)}
.btn{font:600 14px var(--f-body);border-radius:6px;padding:8px 16px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.small{font-size:12.5px;padding:4px 10px}
.btn.warn{color:var(--signal);border-color:var(--signal)}
.btn:disabled{opacity:.55;cursor:default}
body.editing .shell{padding-bottom:140px}
.ed{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:16px;min-width:0}
.ed label{display:flex;flex-direction:column;gap:4px;font:500 12px var(--f-mono);letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.ed input,.ed textarea{font:15px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:7px 9px;width:100%;text-transform:none;letter-spacing:0}
.ed textarea{min-height:84px;resize:vertical;line-height:1.45}
.ed .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ed .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ed .hint{font:13px var(--f-body);color:var(--muted);text-transform:none;letter-spacing:0}
.ed-imgs{display:flex;flex-direction:column;gap:10px}
.ed-img{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:start}
.ed-img img{width:110px;border-radius:4px;border:1px solid var(--line)}
.add-proj{align-self:flex-start;margin-top:24px}

@media (max-width:920px){
  .shell{grid-template-columns:minmax(0,1fr);gap:48px;padding-block:32px 56px}
  .rail{position:static}
  .proj{grid-template-columns:minmax(0,1fr);gap:10px;padding-block:28px}
  .meta{flex-direction:row;flex-wrap:wrap;gap:4px 14px}
}
@media (max-width:560px){
  .name{font-size:1.95rem}
  .proj h3{font-size:1.4rem}
  .skills{grid-template-columns:minmax(0,1fr)}
  .exp li{grid-template-columns:minmax(0,1fr);gap:2px}
  .exp .pl{text-align:left}
  .ed .two{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){.shot img{transition:transform .25s ease}.shot:hover img{transform:scale(1.01)}}
</style>

<script id="pf-main">
(function(){
  "use strict";
  var TITLE = "Gustavo Juárez Portfolio";
  var FONTS = '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">';
  var RESET = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  var STASH = "pf-draft";
  var app = document.getElementById("app");
  var state = JSON.parse(document.getElementById("pf-data").textContent);
  var draft = null, artifactNS = null, busy = false, msg = "", msgErr = false, confirmDel = -1;

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function safeUrl(u){ u = String(u || ""); return /^(https?:|mailto:)/i.test(u) ? u : ""; }
  function safeImg(u){ u = String(u || ""); return /^(data:image\/(png|jpe?g|webp|gif);base64,|\/_blob\/|https:)/i.test(u) ? u : ""; }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function monthLabel(ym){ var m = /^(\d{4})-(\d{2})$/.exec(ym || ""); if(!m) return ""; return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m[2]-1] + " " + m[1]; }

  /* ---------- view ---------- */
  function rail(d){
    var p = d.profile, tp = esc(p.tagpath || "");
    var li = safeUrl(p.linkedin);
    return '<aside class="rail">' +
      (tp ? '<div class="tagpath"><b>' + tp + '</b></div>' : '') +
      '<h1 class="name">' + esc(p.name) + '</h1>' +
      '<p class="role">' + esc(p.role) + '</p>' +
      '<p class="summary">' + esc(p.summary) + '</p>' +
      '<div class="contact">' +
        (p.email ? '<div class="row"><span class="lbl">Email</span><span class="email" id="pf-email">' + esc(p.email) + '</span><button class="copy" type="button" data-act="copy">Copy</button></div>' : '') +
        (li ? '<div class="row"><span class="lbl">LinkedIn</span><a href="' + esc(li) + '" target="_blank" rel="noopener">View profile</a></div>' : '') +
        (p.location ? '<div class="row"><span class="lbl">Based in</span><span>' + esc(p.location) + '</span></div>' : '') +
      '</div>' +
      ((d.readout || []).length ? '<dl class="readout">' + d.readout.map(function(r){ return '<dt>' + esc(r.k) + '</dt><dd>' + esc(r.v) + '</dd>'; }).join("") + '</dl>' : '') +
    '</aside>';
  }

  function gallery(p, pi){
    var imgs = (p.images || []).filter(function(im){ return safeImg(im.src); });
    if(!imgs.length) return "";
    var first = imgs[0];
    var h = '<figure class="gallery"><button class="shot" type="button" data-act="zoom" data-p="' + pi + '" data-i="0" aria-label="Enlarge screenshot"><img src="' + esc(safeImg(first.src)) + '" alt="' + esc(first.caption || p.title) + '" loading="lazy"></button>';
    if(imgs.length > 1){
      h += '<div class="thumbs">' + imgs.slice(1).map(function(im, k){
        return '<button class="shot" type="button" data-act="zoom" data-p="' + pi + '" data-i="' + (k + 1) + '" aria-label="Enlarge screenshot"><img src="' + esc(safeImg(im.src)) + '" alt="' + esc(im.caption || p.title) + '" loading="lazy"></button>';
      }).join("") + '</div>';
    }
    if(first.caption) h += '<figcaption>' + esc(first.caption) + '</figcaption>';
    return h + '</figure>';
  }

  function projView(p, i){
    var links = (p.links || []).filter(function(l){ return safeUrl(l.url); });
    return '<article class="proj" id="p-' + esc(p.id || i) + '">' +
      '<div class="meta"><span class="yr">' + esc(p.year) + '</span><span>' + esc(p.org) + '</span></div>' +
      '<div style="min-width:0">' +
        '<p class="kind">' + esc(p.kind) + '</p>' +
        '<h3>' + esc(p.title) + '</h3>' +
        gallery(p, i) +
        (p.summary ? '<p class="lede">' + esc(p.summary) + '</p>' : '') +
        ((p.points || []).length ? '<ul>' + p.points.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join("") + '</ul>' : '') +
        ((p.stack || []).length ? '<ul class="chips" aria-label="Tools">' + p.stack.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join("") + '</ul>' : '') +
        (links.length ? '<div class="links">' + links.map(function(l){ return '<a href="' + esc(safeUrl(l.url)) + '" target="_blank" rel="noopener">' + esc(l.label || l.url) + ' ↗</a>'; }).join("") + '</div>' : '') +
      '</div></article>';
  }

  /* ---------- editor ---------- */
  function fld(label, path, val, multi, hint){
    var v = esc(val == null ? "" : val);
    return '<label>' + esc(label) + (multi ? '<textarea data-f="' + path + '">' + v + '</textarea>' : '<input type="text" data-f="' + path + '" value="' + v + '">') + (hint ? '<span class="hint">' + esc(hint) + '</span>' : '') + '</label>';
  }
  function railEdit(d){
    var p = d.profile;
    return '<aside class="rail"><div class="ed">' +
      fld("Nombre", "profile.name", p.name) + fld("Rol", "profile.role", p.role) +
      fld("Etiqueta superior", "profile.tagpath", p.tagpath) + fld("Resumen", "profile.summary", p.summary, true) +
      fld("Email", "profile.email", p.email) + fld("LinkedIn (URL)", "profile.linkedin", p.linkedin) + fld("Ubicación", "profile.location", p.location) +
      fld("Ficha técnica", "readout", (d.readout || []).map(function(r){ return r.k + ": " + r.v; }).join("\n"), true, "Una línea por fila: Etiqueta: valor") +
    '</div></aside>';
  }
  function projEdit(p, i, n){
    var imgs = (p.images || []).map(function(im, k){
      return '<div class="ed-img"><img src="' + esc(safeImg(im.src)) + '" alt=""><div class="ed" style="padding:0;border:0;background:none">' +
        fld("Pie de foto", "p." + i + ".img." + k, im.caption) +
        '<div class="acts"><button class="btn small" type="button" data-act="imgUp" data-p="' + i + '" data-i="' + k + '"' + (k ? '' : ' disabled') + '>Subir</button>' +
        '<button class="btn small warn" type="button" data-act="imgDel" data-p="' + i + '" data-i="' + k + '">Quitar</button></div></div></div>';
    }).join("");
    var del = confirmDel === i
      ? '<span class="hint">¿Borrar este proyecto?</span><button class="btn small warn" type="button" data-act="delYes" data-p="' + i + '">Sí, borrar</button><button class="btn small" type="button" data-act="delNo">No</button>'
      : '<button class="btn small warn" type="button" data-act="del" data-p="' + i + '">Borrar proyecto</button>';
    return '<article class="proj"><div class="meta"><span class="yr">#' + (i + 1) + ' de ' + n + '</span></div><div class="ed">' +
      '<div class="two">' + fld("Título", "p." + i + ".title", p.title) + fld("Categoría", "p." + i + ".kind", p.kind) + '</div>' +
      '<div class="two">' + fld("Empresa / equipo", "p." + i + ".org", p.org) + fld("Año", "p." + i + ".year", p.year) + '</div>' +
      fld("Resumen", "p." + i + ".summary", p.summary, true) +
      fld("Puntos clave", "p." + i + ".points", (p.points || []).join("\n"), true, "Un punto por línea") +
      fld("Herramientas", "p." + i + ".stack", (p.stack || []).join(", "), false, "Separadas por comas") +
      fld("Enlaces", "p." + i + ".links", (p.links || []).map(function(l){ return l.label + " | " + l.url; }).join("\n"), true, "Uno por línea: Texto | https://…") +
      '<div class="ed-imgs">' + imgs + '</div>' +
      '<label>Añadir capturas<input type="file" accept="image/png,image/jpeg,image/webp" multiple data-act="upload" data-p="' + i + '"><span class="hint">Se comprimen a WebP de 1800 px de ancho. Tapa nombres de clientes o sitios antes de subirlas.</span></label>' +
      '<div class="acts"><button class="btn small" type="button" data-act="up" data-p="' + i + '"' + (i ? '' : ' disabled') + '>Mover arriba</button>' +
      '<button class="btn small" type="button" data-act="down" data-p="' + i + '"' + (i < n - 1 ? '' : ' disabled') + '>Mover abajo</button>' + del + '</div>' +
    '</div></article>';
  }

  function sections(d, editing){
    var projects = d.projects || [];
    var work = '<section aria-labelledby="h-work"><div class="sec-h"><h2 id="h-work">Selected work</h2><span>' + projects.length + ' projects</span></div><div class="projects">' +
      projects.map(function(p, i){ return editing ? projEdit(p, i, projects.length) : projView(p, i); }).join("") + '</div>' +
      (editing ? '<button class="btn add-proj" type="button" data-act="add">+ Añadir proyecto</button>' : '') + '</section>';
    var exp = '<section aria-labelledby="h-exp"><div class="sec-h"><h2 id="h-exp">Experience & education</h2></div>' +
      (editing ? '<div class="ed">' + fld("Experiencia", "experience", (d.experience || []).map(function(e){ return [e.period, e.org, e.role, e.place].join(" | "); }).join("\n"), true, "Una por línea: Periodo | Empresa | Rol | Lugar") + '</div>'
        : '<ul class="exp">' + (d.experience || []).map(function(e){ return '<li><span class="p">' + esc(e.period) + '</span><span class="o">' + esc(e.org) + '<span class="r">' + esc(e.role) + '</span></span><span class="pl">' + esc(e.place) + '</span></li>'; }).join("") + '</ul>') + '</section>';
    var sk = '<section aria-labelledby="h-skills"><div class="sec-h"><h2 id="h-skills">Skills</h2></div>' +
      (editing ? '<div class="ed">' + fld("Habilidades", "skills", (d.skills || []).map(function(s){ return s.group + ": " + s.items.join(", "); }).join("\n"), true, "Una línea por grupo: Grupo: a, b, c") + '</div>'
        : '<div class="skills">' + (d.skills || []).map(function(s){ return '<div><h4>' + esc(s.group) + '</h4><p>' + s.items.map(esc).join(" · ") + '</p></div>'; }).join("") + '</div>') + '</section>';
    var foot = '<div class="foot"><span>' + esc(d.profile.name) + '</span><span>' + (d.updated ? 'Updated ' + esc(monthLabel(d.updated)) : '') + '</span></div>';
    return '<main class="main">' + work + exp + sk + foot + '</main>';
  }

  function render(){
    var editing = !!draft, d = editing ? draft : state;
    document.body.classList.toggle("editing", editing);
    app.innerHTML = '<div class="shell">' + (editing ? railEdit(d) : rail(d)) + sections(d, editing) + '</div>' + chrome();
  }
  function chrome(){
    if(!artifactNS) return "";
    if(!draft) return '<button class="ed-toggle" type="button" data-act="edit">Editar portafolio</button>';
    return '<div class="ed-bar" role="region" aria-label="Edición"><span class="msg' + (msgErr ? ' err' : '') + '" role="status">' + esc(msg || "Modo edición: solo tú ves estos controles.") + '</span>' +
      '<button class="btn" type="button" data-act="cancel"' + (busy ? ' disabled' : '') + '>Descartar cambios</button>' +
      '<button class="btn primary" type="button" data-act="save"' + (busy ? ' disabled' : '') + '>' + (busy ? 'Publicando…' : 'Guardar y publicar') + '</button></div>';
  }
  function setMsg(t, err){ msg = t; msgErr = !!err; var m = app.querySelector(".ed-bar .msg"); if(m){ m.textContent = t; m.classList.toggle("err", !!err); } }

  /* ---------- field binding ---------- */
  function lines(v){ return String(v).split("\n").map(function(s){ return s.trim(); }).filter(Boolean); }
  function applyField(path, v){
    var d = draft, m;
    if(path.indexOf("profile.") === 0){ d.profile[path.slice(8)] = v; return; }
    if(path === "readout"){ d.readout = lines(v).map(function(l){ var k = l.indexOf(":"); return k > -1 ? {k:l.slice(0,k).trim(), v:l.slice(k+1).trim()} : {k:l, v:""}; }); return; }
    if(path === "experience"){ d.experience = lines(v).map(function(l){ var a = l.split("|").map(function(s){ return s.trim(); }); return {period:a[0]||"", org:a[1]||"", role:a[2]||"", place:a[3]||""}; }); return; }
    if(path === "skills"){ d.skills = lines(v).map(function(l){ var k = l.indexOf(":"); return {group:k > -1 ? l.slice(0,k).trim() : l, items:k > -1 ? l.slice(k+1).split(",").map(function(s){ return s.trim(); }).filter(Boolean) : []}; }); return; }
    if((m = /^p\.(\d+)\.img\.(\d+)$/.exec(path))){ d.projects[+m[1]].images[+m[2]].caption = v; return; }
    if((m = /^p\.(\d+)\.(\w+)$/.exec(path))){
      var p = d.projects[+m[1]], f = m[2];
      if(f === "points") p.points = lines(v);
      else if(f === "stack") p.stack = String(v).split(",").map(function(s){ return s.trim(); }).filter(Boolean);
      else if(f === "links") p.links = lines(v).map(function(l){ var k = l.lastIndexOf("|"); return k > -1 ? {label:l.slice(0,k).trim(), url:l.slice(k+1).trim()} : {label:l, url:l}; });
      else p[f] = v;
    }
  }
  app.addEventListener("input", function(e){ var f = e.target.getAttribute("data-f"); if(f && draft) applyField(f, e.target.value); });

  /* ---------- images ---------- */
  function compress(file){
    return new Promise(function(res, rej){
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function(){
        var w = Math.min(1800, img.naturalWidth), h = Math.round(img.naturalHeight * w / img.naturalWidth);
        var c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
        var out = c.toDataURL("image/webp", 0.82);
        if(out.indexOf("data:image/webp") !== 0) out = c.toDataURL("image/jpeg", 0.85);
        res(out);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("No se pudo leer " + file.name)); };
      img.src = url;
    });
  }
  app.addEventListener("change", function(e){
    var t = e.target; if(t.getAttribute("data-act") !== "upload" || !draft) return;
    var pi = +t.getAttribute("data-p"), files = Array.prototype.slice.call(t.files || []);
    if(!files.length) return;
    setMsg("Procesando " + files.length + " imagen(es)…");
    Promise.all(files.map(compress)).then(function(srcs){
      var p = draft.projects[pi]; p.images = p.images || [];
      srcs.forEach(function(s){ p.images.push({src:s, caption:""}); });
      msg = "Imagen añadida. Escribe un pie de foto y publica."; msgErr = false; render();
    }).catch(function(err){ setMsg(err.message, true); });
  });

  /* ---------- publish ---------- */
  function buildDoc(data){
    var css = document.getElementById("pf-style").textContent;
    var js = document.getElementById("pf-main").textContent;
    var json = JSON.stringify(data).replace(/</g, "\\u003c");
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>' +
      '<title>' + esc(TITLE) + '</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' + FONTS + '\n<style id="pf-style">' + css + '</style>\n<div id="app"></div>\n' +
      '<script type="application/json" id="pf-data">' + json + '<\/script>\n<script id="pf-main">' + js + '<\/script>\n</body></html>';
  }
  function save(){
    if(busy || !draft || !artifactNS) return;
    var d = clone(draft), now = new Date();
    d.updated = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
    var html = buildDoc(d);
    if(html.length > 15.5 * 1024 * 1024){ setMsg("La página pesa demasiado (" + (html.length / 1048576).toFixed(1) + " MB). Quita alguna captura.", true); return; }
    try{ sessionStorage.setItem(STASH, JSON.stringify(d)); }catch(_){}
    busy = true; msg = "Publicando…"; msgErr = false; render();
    artifactNS.publish(html).then(function(){
      try{ sessionStorage.removeItem(STASH); }catch(_){}
      setMsg("Publicado. La página se recargará con la nueva versión.");
    }).catch(function(err){
      busy = false;
      var c = err && err.code;
      if(c === "conflict"){ msg = "Había una versión más nueva; la página se recargará. Tu borrador quedó guardado en esta pestaña."; }
      else if(c === "not_writer" || c === "not_granted" || c === "not_declared" || c === "capability_disabled" || c === "consent_required"){ try{ sessionStorage.removeItem(STASH); }catch(_){} artifactNS = null; draft = null; msg = ""; }
      else if(c === "too_large"){ msg = "La página supera el límite de tamaño. Quita alguna captura."; }
      else if(c === "rate_limited"){ msg = "Demasiadas publicaciones seguidas. Espera un minuto y vuelve a intentar."; }
      else { msg = "No se pudo publicar (" + (c || "error") + "). Intenta de nuevo."; }
      msgErr = true; render();
    });
  }

  /* ---------- clicks ---------- */
  function lightbox(pi, ii){
    var p = state.projects[pi]; if(draft) p = draft.projects[pi];
    var im = (p.images || []).filter(function(x){ return safeImg(x.src); })[ii]; if(!im) return;
    var lb = document.createElement("div"); lb.className = "lb"; lb.setAttribute("role", "dialog"); lb.setAttribute("aria-label", "Screenshot");
    lb.innerHTML = '<img src="' + esc(safeImg(im.src)) + '" alt="' + esc(im.caption || p.title) + '">' + (im.caption ? '<p>' + esc(im.caption) + '</p>' : '');
    function close(){ lb.remove(); document.removeEventListener("keydown", onKey); }
    function onKey(e){ if(e.key === "Escape") close(); }
    lb.addEventListener("click", close); document.addEventListener("keydown", onKey);
    document.body.appendChild(lb);
  }
  app.addEventListener("click", function(e){
    var b = e.target.closest("[data-act]"); if(!b || b.tagName === "INPUT") return;
    var a = b.getAttribute("data-act"), pi = +b.getAttribute("data-p"), ii = +b.getAttribute("data-i");
    if(a === "zoom") return lightbox(pi, ii);
    if(a === "copy"){
      var em = document.getElementById("pf-email"), txt = em ? em.textContent : "";
      var done = function(){ b.textContent = "Copied"; setTimeout(function(){ b.textContent = "Copy"; }, 1600); };
      var fallback = function(){ var r = document.createRange(); r.selectNodeContents(em); var s = getSelection(); s.removeAllRanges(); s.addRange(r); };
      try{ navigator.clipboard.writeText(txt).then(done, fallback); }catch(_){ fallback(); }
      return;
    }
    if(a === "edit"){ draft = clone(state); msg = ""; msgErr = false; confirmDel = -1; render(); return; }
    if(!draft) return;
    var ps = draft.projects;
    if(a === "cancel"){ draft = null; try{ sessionStorage.removeItem(STASH); }catch(_){} render(); return; }
    if(a === "save") return save();
    if(a === "add"){ ps.push({id:"p" + Date.now().toString(36), kind:"Categoría", title:"Nuevo proyecto", org:"", year:String(new Date().getFullYear()), summary:"", points:[], stack:[], images:[], links:[]}); render(); return; }
    if(a === "up" && pi > 0){ ps.splice(pi - 1, 0, ps.splice(pi, 1)[0]); }
    else if(a === "down" && pi < ps.length - 1){ ps.splice(pi + 1, 0, ps.splice(pi, 1)[0]); }
    else if(a === "del"){ confirmDel = pi; }
    else if(a === "delNo"){ confirmDel = -1; }
    else if(a === "delYes"){ ps.splice(pi, 1); confirmDel = -1; }
    else if(a === "imgDel"){ ps[pi].images.splice(ii, 1); }
    else if(a === "imgUp" && ii > 0){ var im = ps[pi].images; im.splice(ii - 1, 0, im.splice(ii, 1)[0]); }
    render();
  });

  render();

  /* ---------- owner editing (only when the viewer can publish) ---------- */
  (function(){
    if(!window.claude || typeof window.claude.use !== "function") return;
    Promise.all([window.claude.use("artifact"), window.claude.use("user")]).then(function(r){
      var a = r[0], u = r[1];
      if(!a || !u) return;
      return u.canEdit().then(function(ok){
        if(!ok) return;
        artifactNS = a;
        try{ var s = sessionStorage.getItem(STASH); if(s){ draft = JSON.parse(s); msg = "Recuperé tu borrador sin publicar."; } }catch(_){}
        render();
      });
    }).catch(function(){});
  })();
})();
</script>

</body></html>
